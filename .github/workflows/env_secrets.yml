
name: Demo CI Env Secrets

on:
  # push:
   workflow_dispatch

env:
    GOOGLE_APP_ENV: google-dev

jobs:
   build:
     runs-on: ubuntu-latest
     
     env:
        JOB_APP_ENV: job-dev

     steps:
        - name: Say Hello
          run: echo "Hello from the second workflow!" 

        - name: Install
          env:
            APP_ENV: dev
            DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          run: echo "Environment $APP_ENV using $DB_PASSWORD, GOOGLE_APP_ENV, $JOB_APP_ENV" 


        - name: Create demo files
          run: |
            echo "This is a demo file" > demo.txt
            echo "This is another demo file" > demo2.txt
            echo "Files created successfully"


        - name: Upload Demo
          uses: actions/upload-artifact@v3
          with:
            name: Build-demo-files 
            path: .


   test:
      runs-on: ubuntu-latest
      needs: build
      
      steps:
        - name: Test Job
          run: echo "TestJob"